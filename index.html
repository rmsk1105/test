<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT 문제은행</title>
  <script src="questions.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F7F7F7;
      min-height: 100vh;
      color: #222222;
    }

    /* ── 헤더 ── */
    header {
      background: #FFFFFF;
      border-bottom: 1px solid #EBEBEB;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #FF385C;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .logo-text {
      font-size: 1rem;
      font-weight: 700;
      color: #222222;
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 0.72rem;
      color: #717171;
      font-weight: 400;
    }
    .back-btn {
      background: #FFFFFF;
      border: 1.5px solid #DDDDDD;
      color: #222222;
      padding: 8px 16px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .back-btn:hover {
      border-color: #222222;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    /* ── 공통 레이아웃 ── */
    .screen { display: none; max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    .screen.active { display: block; }

    /* ── 홈 화면 ── */
    .home-hero {
      text-align: center;
      padding: 40px 0 36px;
    }
    .home-hero-badge {
      display: inline-block;
      background: #FFF0F3;
      color: #FF385C;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }
    .home-title {
      font-size: 2rem;
      font-weight: 800;
      color: #222222;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 10px;
    }
    .home-desc {
      color: #717171;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #717171;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    /* 과목 카드 */
    .subject-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }
    .subject-card {
      border: 1.5px solid #DDDDDD;
      border-radius: 16px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: white;
      position: relative;
      overflow: hidden;
    }
    .subject-card:hover {
      border-color: #222222;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }
    .subject-card.selected {
      border-color: #222222;
      background: #FFFFFF;
      box-shadow: 0 0 0 2px #222222;
    }
    .subject-card.selected::after {
      content: '✓';
      position: absolute;
      top: 10px;
      right: 12px;
      width: 20px;
      height: 20px;
      background: #222222;
      color: white;
      border-radius: 50%;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 20px;
    }
    .subject-card .icon { font-size: 1.8rem; margin-bottom: 8px; }
    .subject-card .name { font-size: 0.78rem; font-weight: 700; color: #222222; line-height: 1.4; }
    .subject-card .count { font-size: 0.7rem; color: #B0B0B0; margin-top: 4px; font-weight: 500; }

    /* 모드 버튼 */
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .mode-btn {
      border: 1.5px solid #DDDDDD;
      border-radius: 16px;
      padding: 22px 18px;
      cursor: pointer;
      background: white;
      text-align: left;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .mode-btn:hover {
      border-color: #222222;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }
    .mode-btn .mode-icon { font-size: 1.6rem; margin-bottom: 10px; }
    .mode-btn .mode-name { font-weight: 700; font-size: 1rem; color: #222222; }
    .mode-btn .mode-desc { font-size: 0.8rem; color: #717171; margin-top: 4px; line-height: 1.4; }

    /* ── 퀴즈 화면 ── */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .quiz-progress { font-size: 0.85rem; color: #717171; font-weight: 500; }
    .quiz-score {
      background: #F7F7F7;
      color: #222222;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1.5px solid #EBEBEB;
    }
    .progress-bar {
      height: 4px;
      background: #EBEBEB;
      border-radius: 2px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #FF385C;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .question-card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      border: 1.5px solid #EBEBEB;
      margin-bottom: 16px;
    }
    .question-meta {
      font-size: 0.75rem;
      color: #B0B0B0;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .question-text {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.65;
      color: #222222;
    }

    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border: 1.5px solid #DDDDDD;
      border-radius: 12px;
      cursor: pointer;
      background: white;
      text-align: left;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: #222222;
      transition: all 0.15s;
      width: 100%;
      line-height: 1.4;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: #222222;
      background: #F7F7F7;
    }
    .choice-btn .num {
      min-width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #F7F7F7;
      border: 1.5px solid #DDDDDD;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.82rem;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .choice-btn.correct { border-color: #008A05; background: #F0FBF0; }
    .choice-btn.correct .num { background: #008A05; border-color: #008A05; color: white; }
    .choice-btn.wrong { border-color: #FF385C; background: #FFF5F5; }
    .choice-btn.wrong .num { background: #FF385C; border-color: #FF385C; color: white; }
    .choice-btn.show-correct { border-color: #008A05; background: #F0FBF0; }
    .choice-btn.show-correct .num { background: #008A05; border-color: #008A05; color: white; }
    .choice-btn:disabled { cursor: default; }

    .explanation-box {
      background: white;
      border: 1.5px solid #EBEBEB;
      border-left: 4px solid #008A05;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 0.87rem;
      line-height: 1.65;
      color: #484848;
      margin-top: 12px;
      display: none;
    }
    .explanation-box.show { display: block; }
    .explanation-label {
      font-weight: 700;
      color: #008A05;
      margin-bottom: 6px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .quiz-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-primary {
      flex: 1;
      padding: 15px;
      background: #FF385C;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: -0.1px;
    }
    .btn-primary:hover { background: #E31C5F; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      padding: 15px 20px;
      background: white;
      color: #484848;
      border: 1.5px solid #DDDDDD;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: #222222; color: #222222; }

    /* ── 결과 화면 ── */
    .result-card {
      background: white;
      border-radius: 24px;
      padding: 48px 24px 40px;
      text-align: center;
      border: 1.5px solid #EBEBEB;
      margin-bottom: 20px;
    }
    .result-emoji { font-size: 3.5rem; margin-bottom: 16px; }
    .result-score { font-size: 3rem; font-weight: 800; color: #222222; letter-spacing: -1px; }
    .result-score span { font-size: 1.2rem; color: #717171; font-weight: 500; }
    .result-label { font-size: 0.95rem; color: #717171; margin-top: 8px; line-height: 1.5; }
    .result-divider { border: none; border-top: 1px solid #EBEBEB; margin: 24px 0; }
    .result-actions { display: flex; gap: 12px; flex-direction: column; }

    /* ── 검색 화면 ── */
    .search-box-wrap { position: relative; margin-bottom: 16px; }
    .search-input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      border: 1.5px solid #DDDDDD;
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      color: #222222;
    }
    .search-input:focus {
      border-color: #222222;
      box-shadow: 0 0 0 3px rgba(34,34,34,0.08);
    }
    .search-input::placeholder { color: #B0B0B0; }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: #B0B0B0;
    }
    .search-filter { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn {
      padding: 7px 16px;
      border: 1.5px solid #DDDDDD;
      border-radius: 24px;
      background: white;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      color: #484848;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: #222222; color: #222222; }
    .filter-btn.active { border-color: #222222; background: #222222; color: white; }

    .search-results { display: flex; flex-direction: column; gap: 10px; }
    .search-count { font-size: 0.82rem; color: #717171; margin-bottom: 10px; font-weight: 500; }

    .result-item {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1.5px solid #EBEBEB;
      cursor: pointer;
      transition: all 0.2s;
    }
    .result-item:hover { border-color: #DDDDDD; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
    .result-item.expanded { border-color: #222222; }
    .result-item-header { display: flex; align-items: flex-start; gap: 10px; }
    .result-badge {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .badge-climate { background: #FFF0F3; color: #FF385C; }
    .badge-esg { background: #EBF5FF; color: #0066CC; }
    .result-item-question { font-size: 0.9rem; font-weight: 600; line-height: 1.5; color: #222222; }
    .result-item-body { margin-top: 14px; display: none; }
    .result-item.expanded .result-item-body { display: block; }
    .result-choice {
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
      font-weight: 500;
    }
    .result-choice.answer { background: #F0FBF0; border: 1.5px solid #008A05; color: #222222; font-weight: 600; }
    .result-choice:not(.answer) { background: #F7F7F7; color: #717171; }
    .result-explanation {
      margin-top: 10px;
      padding: 12px 14px;
      background: #F7F7F7;
      border-left: 3px solid #008A05;
      border-radius: 8px;
      font-size: 0.83rem;
      line-height: 1.65;
      color: #484848;
    }

    mark { background: #FFF3CD; border-radius: 3px; padding: 0 2px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #B0B0B0;
    }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; font-weight: 500; }

    @media (max-width: 480px) {
      .home-title { font-size: 1.6rem; }
      .subject-grid { grid-template-columns: 1fr 1fr 1fr; }
      .mode-grid { grid-template-columns: 1fr; }
      .subject-card .name { font-size: 0.72rem; }
      .screen { padding: 20px 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div>
        <div class="logo-text">CBT 문제은행</div>
        <div class="logo-sub">기말고사 대비</div>
      </div>
    </div>
    <button class="back-btn" id="backBtn" style="display:none" onclick="goHome()">← 홈으로</button>
  </div>
</header>

<!-- ══════════════ 홈 화면 ══════════════ -->
<div class="screen active" id="homeScreen">

  <div class="home-hero">
    <div class="home-hero-badge">🎯 기말고사 대비</div>
    <h1 class="home-title">어디서든<br>문제 풀기</h1>
    <p class="home-desc">과목을 선택하고 원하는 학습 모드로 시작하세요</p>
  </div>

  <div class="section-label">과목 선택</div>
  <div class="subject-grid">
    <div class="subject-card selected" id="card-climate" onclick="toggleSubject('climate')">
      <div class="icon">🌍</div>
      <div class="name">기후변화<br>완화와 적응</div>
      <div class="count">130문제</div>
    </div>
    <div class="subject-card selected" id="card-esg" onclick="toggleSubject('esg')">
      <div class="icon">📊</div>
      <div class="name">ESG와<br>미래가치 창출</div>
      <div class="count">46문제</div>
    </div>
    <div class="subject-card selected" id="card-both" onclick="selectBoth()">
      <div class="icon">🔀</div>
      <div class="name">전체<br>랜덤</div>
      <div class="count">176문제</div>
    </div>
  </div>

  <div class="section-label">학습 모드</div>
  <div class="mode-grid">
    <button class="mode-btn" onclick="startQuiz()">
      <div class="mode-icon">🎲</div>
      <div class="mode-name">랜덤 퀴즈</div>
      <div class="mode-desc">선택한 과목에서 20문제를 랜덤으로 출제</div>
    </button>
    <button class="mode-btn" onclick="showSearch()">
      <div class="mode-icon">🔍</div>
      <div class="mode-name">키워드 검색</div>
      <div class="mode-desc">키워드로 관련 문제를 모아서 확인</div>
    </button>
  </div>

</div>

<!-- ══════════════ 퀴즈 화면 ══════════════ -->
<div class="screen" id="quizScreen">
  <div class="quiz-header">
    <div class="quiz-progress" id="quizProgress">1 / 20</div>
    <div class="quiz-score" id="quizScore">✅ 0 / 0</div>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="question-card">
    <div class="question-meta" id="questionMeta"></div>
    <div class="question-text" id="questionText"></div>
  </div>

  <div class="choices" id="choicesContainer"></div>

  <div class="explanation-box" id="explanationBox">
    <div class="explanation-label">💡 해설</div>
    <div id="explanationText"></div>
  </div>

  <div class="quiz-actions">
    <button class="btn-secondary" id="skipBtn" onclick="nextQuestion()">건너뛰기</button>
    <button class="btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none">다음 문제 →</button>
  </div>
</div>

<!-- ══════════════ 결과 화면 ══════════════ -->
<div class="screen" id="resultScreen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-label" id="resultLabel"></div>
  </div>
  <div class="result-actions">
    <button class="btn-primary" onclick="startQuiz()">🔄 다시 풀기</button>
    <button class="btn-secondary" onclick="goHome()">🏠 홈으로 돌아가기</button>
  </div>
</div>

<!-- ══════════════ 검색 화면 ══════════════ -->
<div class="screen" id="searchScreen">
  <div class="search-box-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text"
      placeholder="키워드 입력 (예: 탄소중립, ESG, 파리협정...)"
      oninput="doSearch()">
  </div>
  <div class="search-filter">
    <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">전체</button>
    <button class="filter-btn" id="filter-climate" onclick="setFilter('climate')">🌍 기후변화</button>
    <button class="filter-btn" id="filter-esg" onclick="setFilter('esg')">📊 ESG</button>
  </div>
  <div id="searchResultsArea">
    <div class="empty-state">
      <div class="empty-icon">🔍</div>
      <p>키워드를 입력하면 관련 문제가 나타납니다</p>
    </div>
  </div>
</div>

<script>
  // ── 상태 ──
  let selectedSubjects = ['climate', 'esg'];
  let quizQuestions = [];
  let currentIdx = 0;
  let score = 0;
  let answered = false;
  let searchFilter = 'all';
  const QUIZ_COUNT = 20;

  // ── 과목 선택 ──
  function toggleSubject(sub) {
    if (selectedSubjects.length === 1 && selectedSubjects[0] === sub) {
      selectedSubjects = ['climate', 'esg'];
    } else {
      selectedSubjects = [sub];
    }
    updateSubjectCards();
  }

  function selectBoth() {
    selectedSubjects = ['climate', 'esg'];
    updateSubjectCards();
  }

  function updateSubjectCards() {
    document.getElementById('card-climate').classList.toggle('selected', selectedSubjects.includes('climate'));
    document.getElementById('card-esg').classList.toggle('selected', selectedSubjects.includes('esg'));
    const both = selectedSubjects.includes('climate') && selectedSubjects.includes('esg');
    document.getElementById('card-both').classList.toggle('selected', both);
  }

  // ── 퀴즈 시작 ──
  function startQuiz() {
    let pool = [];
    if (selectedSubjects.includes('climate')) {
      pool = pool.concat(questions.climate.map(q => ({...q, subject: 'climate'})));
    }
    if (selectedSubjects.includes('esg')) {
      pool = pool.concat(questions.esg.map(q => ({...q, subject: 'esg'})));
    }
    if (pool.length === 0) { alert('과목을 선택해주세요!'); return; }

    pool = pool.sort(() => Math.random() - 0.5);
    quizQuestions = pool.slice(0, Math.min(QUIZ_COUNT, pool.length));
    currentIdx = 0;
    score = 0;

    showScreen('quizScreen');
    renderQuestion();
  }

  // ── 문제 렌더링 ──
  function renderQuestion() {
    answered = false;
    const q = quizQuestions[currentIdx];
    const total = quizQuestions.length;

    document.getElementById('quizProgress').textContent = `${currentIdx + 1} / ${total}`;
    document.getElementById('quizScore').textContent = `✅ ${score} / ${currentIdx}`;
    document.getElementById('progressFill').style.width = `${(currentIdx / total) * 100}%`;

    const subLabel = q.subject === 'climate' ? '🌍 기후변화' : '📊 ESG';
    const weekLabel = q.week ? ` · ${q.week}주차` : '';
    document.getElementById('questionMeta').textContent = subLabel + weekLabel;
    document.getElementById('questionText').textContent = q.question;

    const container = document.getElementById('choicesContainer');
    container.innerHTML = '';
    q.choices.forEach((choice, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="num">${i + 1}</span><span>${choice}</span>`;
      btn.onclick = () => selectAnswer(i + 1, q.answer, q.explanation);
      container.appendChild(btn);
    });

    document.getElementById('explanationBox').classList.remove('show');
    document.getElementById('skipBtn').style.display = 'inline-block';
    document.getElementById('nextBtn').style.display = 'none';
  }

  // ── 답 선택 ──
  function selectAnswer(selected, correct, explanation) {
    if (answered) return;
    answered = true;

    const btns = document.querySelectorAll('.choice-btn');
    btns.forEach((btn, i) => {
      btn.disabled = true;
      const num = i + 1;
      if (num === correct) btn.classList.add('show-correct');
      if (num === selected && selected !== correct) btn.classList.add('wrong');
      if (num === selected && selected === correct) btn.classList.add('correct');
    });

    if (selected === correct) score++;

    if (explanation) {
      document.getElementById('explanationText').textContent = explanation;
      document.getElementById('explanationBox').classList.add('show');
    }

    document.getElementById('skipBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'inline-block';
  }

  // ── 다음 문제 ──
  function nextQuestion() {
    currentIdx++;
    if (currentIdx >= quizQuestions.length) {
      showResult();
    } else {
      renderQuestion();
    }
  }

  // ── 결과 ──
  function showResult() {
    const total = quizQuestions.length;
    const pct = Math.round((score / total) * 100);
    let emoji = '😅'; let label = '조금 더 복습이 필요해요!';
    if (pct >= 90) { emoji = '🏆'; label = '완벽해요! 시험 걱정 없겠는데요?'; }
    else if (pct >= 70) { emoji = '👍'; label = '잘 하고 있어요! 조금만 더!'; }
    else if (pct >= 50) { emoji = '📚'; label = '절반은 맞았어요. 복습이 필요해요!'; }

    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultScore').innerHTML = `${score}<span> / ${total}</span>`;
    document.getElementById('resultLabel').textContent = `정답률 ${pct}% · ${label}`;

    showScreen('resultScreen');
  }

  // ── 검색 ──
  function showSearch() {
    showScreen('searchScreen');
    document.getElementById('searchInput').focus();
  }

  function setFilter(f) {
    searchFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('filter-' + f).classList.add('active');
    doSearch();
  }

  function doSearch() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const area = document.getElementById('searchResultsArea');

    if (!keyword) {
      area.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><p>키워드를 입력하면 관련 문제가 나타납니다</p></div>`;
      return;
    }

    let pool = [];
    if (searchFilter !== 'esg') pool = pool.concat(questions.climate.map(q => ({...q, subject:'climate'})));
    if (searchFilter !== 'climate') pool = pool.concat(questions.esg.map(q => ({...q, subject:'esg'})));

    const results = pool.filter(q => {
      const text = [q.question, ...q.choices, q.explanation || ''].join(' ').toLowerCase();
      return text.includes(keyword);
    });

    if (results.length === 0) {
      area.innerHTML = `<div class="empty-state"><div class="empty-icon">😶</div><p>'${keyword}' 관련 문제가 없어요</p></div>`;
      return;
    }

    const highlight = (text) => text.replace(new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
      m => `<mark>${m}</mark>`);

    area.innerHTML = `<div class="search-count">🔎 <b>${results.length}개</b> 문제 발견</div>
      <div class="search-results">
        ${results.map((q, idx) => `
          <div class="result-item" id="ri-${idx}" onclick="toggleResult(${idx})">
            <div class="result-item-header">
              <span class="result-badge ${q.subject === 'climate' ? 'badge-climate' : 'badge-esg'}">
                ${q.subject === 'climate' ? '🌍 기후변화' + (q.week ? ' ' + q.week + '주' : '') : '📊 ESG'}
              </span>
              <div class="result-item-question">${highlight(q.question)}</div>
            </div>
            <div class="result-item-body">
              ${q.choices.map((c, i) => `
                <div class="result-choice ${i + 1 === q.answer ? 'answer' : ''}">
                  <span>${i + 1}.</span><span>${highlight(c)}${i + 1 === q.answer ? ' ✅' : ''}</span>
                </div>
              `).join('')}
              ${q.explanation ? `<div class="result-explanation">💡 ${highlight(q.explanation)}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>`;
  }

  function toggleResult(idx) {
    const el = document.getElementById('ri-' + idx);
    el.classList.toggle('expanded');
  }

  // ── 화면 전환 ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('backBtn').style.display = id === 'homeScreen' ? 'none' : 'block';
    window.scrollTo(0, 0);
  }

  function goHome() { showScreen('homeScreen'); }
</script>
</body>
</html>
